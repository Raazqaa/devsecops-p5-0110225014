<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSecOps Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800/80 rounded-2xl shadow-2xl p-8 backdrop-blur-md relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-xl font-medium tracking-tight text-slate-100">DevSecOps Console</h1>
                <p class="text-xs text-slate-400 mt-0.5">Security Activity Log & Audit Monitor</p>
            </div>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Active
            </span>
        </div>

        <!-- Form Input Note -->
        <div class="mt-6 space-y-4">
            <div>
                <label for="noteInput" class="block text-xs font-medium text-slate-400 mb-2">ENTRY SECURITY NOTE</label>
                <div class="relative">
                    <input type="text" id="noteInput" placeholder="Ketik catatan keamanan (min. 5 karakter)..." 
                           class="w-full px-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-slate-600 focus:ring-1 focus:ring-slate-600 transition">
                </div>
            </div>
            <button onclick="submitNote()" 
                    class="w-full bg-slate-100 hover:bg-white text-slate-950 font-medium py-2.5 px-4 rounded-xl text-sm transition duration-150 active:scale-[0.99]">
                Simpan Catatan
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="result" class="mt-4 hidden p-3.5 rounded-xl text-xs transition duration-200"></div>

        <!-- Activity Log List (Daftar Catatan) -->
        <div class="mt-8 pt-6 border-t border-slate-800/80">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Audit Trail / Catatan</h2>
                <span id="logCount" class="text-[11px] text-slate-500">0 Items</span>
            </div>
            <div id="notesContainer" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <p id="emptyState" class="text-xs text-slate-500 py-3 text-center italic">Belum ada catatan keamanan tersimpan.</p>
            </div>
        </div>

    </div>

    <!-- Modal Edit Note -->
    <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-medium text-slate-200">Edit Catatan Keamanan</h3>
            <input type="hidden" id="editNoteId">
            <input type="text" id="editNoteInput" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-slate-600">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium hover:bg-slate-700">Batal</button>
                <button onclick="saveEditedNote()" class="px-4 py-2 bg-slate-100 text-slate-950 rounded-xl text-xs font-medium hover:bg-white">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", fetchNotes);

        async function fetchNotes() {
            try {
                const response = await fetch('/notes');
                if (response.ok) {
                    const result = await response.json();
                    renderNotes(result.data || []);
                }
            } catch (err) {
                console.error("Gagal mengambil data catatan:", err);
            }
        }

        function renderNotes(notes) {
            const container = document.getElementById('notesContainer');
            const logCount = document.getElementById('logCount');

            if (!notes || notes.length === 0) {
                container.innerHTML = `<p id="emptyState" class="text-xs text-slate-500 py-3 text-center italic">Belum ada catatan keamanan tersimpan.</p>`;
                logCount.innerText = `0 Items`;
                return;
            }

            logCount.innerText = `${notes.length} Items`;
            
            container.innerHTML = notes.slice().reverse().map(item => `
                <div class="p-3 bg-slate-950/40 border border-slate-800/60 rounded-xl flex items-center justify-between gap-3 text-xs">
                    <div class="space-y-0.5 overflow-hidden">
                        <p class="text-slate-200 font-normal leading-relaxed truncate">${escapeHtml(item.content)}</p>
                        <p class="text-[10px] text-slate-500">${formatDate(item.created_at)}</p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="openEditModal(${item.id}, '${escapeHtml(item.content)}')" class="text-[11px] text-slate-400 hover:text-slate-200 px-2 py-1 rounded bg-slate-800/50 hover:bg-slate-800">Edit</button>
                        <button onclick="deleteNote(${item.id})" class="text-[11px] text-rose-400 hover:text-rose-300 px-2 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        async function submitNote() {
            const input = document.getElementById('noteInput');
            const noteValue = input.value;
            
            try {
                const response = await fetch(`/notes?note=${encodeURIComponent(noteValue)}`, { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    showAlert(`✓ ${data.message}`, 'success');
                    input.value = '';
                    fetchNotes();
                } else {
                    showAlert(`✕ ${data.detail || "Gagal menyimpan catatan"}`, 'error');
                }
            } catch (err) {
                showAlert(`✕ Gagal terhubung ke server`, 'error');
            }
        }

        async function deleteNote(id) {
            if(!confirm("Yakin ingin menghapus catatan ini?")) return;
            try {
                const response = await fetch(`/notes/${id}`, { method: 'DELETE' });
                const data = await response.json();
                if (response.ok) {
                    showAlert(`✓ ${data.message}`, 'success');
                    fetchNotes();
                } else {
                    showAlert(`✕ ${data.detail}`, 'error');
                }
            } catch (err) {
                showAlert(`✕ Gagal menghapus catatan`, 'error');
            }
        }

        function openEditModal(id, content) {
            document.getElementById('editNoteId').value = id;
            document.getElementById('editNoteInput').value = content;
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
        }

        async function saveEditedNote() {
            const id = document.getElementById('editNoteId').value;
            const content = document.getElementById('editNoteInput').value;

            try {
                const response = await fetch(`/notes/${id}?note=${encodeURIComponent(content)}`, { method: 'PUT' });
                const data = await response.json();
                if (response.ok) {
                    showAlert(`✓ ${data.message}`, 'success');
                    closeEditModal();
                    fetchNotes();
                } else {
                    alert(data.detail || "Gagal memperbarui catatan");
                }
            } catch (err) {
                alert("Gagal terhubung ke server");
            }
        }

        function showAlert(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
            if (type === 'success') {
                resultDiv.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
            } else {
                resultDiv.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/20');
            }
            resultDiv.innerHTML = message;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function formatDate(isoString) {
            if(!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
        }
    </script>
</body>
</html>
